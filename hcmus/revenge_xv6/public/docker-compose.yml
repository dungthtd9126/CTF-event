services:
  xv6_revenge:
    build:
      context: .
      dockerfile: Dockerfile.serve
    restart: unless-stopped
    init: true

    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777,exec

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    mem_limit: 3g
    pids_limit: 768
    cpus: 2.0

    ports:
      - "6666:1337"
